services:
  - type: web
    name: foodlens-api
    env: docker
    plan: starter
    region: virginia
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_STATE_BACKEND
        value: postgres
      - key: AUTH_STATE_TABLE
        value: auth_runtime_state
      - key: AUTH_STATE_KEY
        value: default
      - key: OPENAPI_EXPORT_ONLY
        value: "0"
      - key: ANALYSIS_RATE_LIMIT_ENABLED
        value: "1"
      - key: ANALYSIS_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: ANALYSIS_RATE_LIMIT_ANALYZE_PER_MIN
        value: "15"
      - key: ANALYSIS_RATE_LIMIT_LABEL_PER_MIN
        value: "15"
      - key: ANALYSIS_RATE_LIMIT_SMART_PER_MIN
        value: "15"
      - key: ANALYSIS_RATE_LIMIT_BARCODE_PER_MIN
        value: "30"
      - key: ANALYSIS_INFLIGHT_GUARD_ENABLED
        value: "1"
      - key: ANALYSIS_INFLIGHT_MAX_ANALYZE
        value: "3"
      - key: ANALYSIS_INFLIGHT_MAX_LABEL
        value: "3"
      - key: ANALYSIS_INFLIGHT_MAX_SMART
        value: "3"
      - key: ANALYSIS_INFLIGHT_MAX_BARCODE
        value: "6"
      - key: ANALYSIS_INFLIGHT_RETRY_AFTER_SECONDS
        value: "2"
      - key: ANALYSIS_CORS_ALLOWED_ORIGINS
        sync: false
      - key: ANALYSIS_CORS_ALLOW_ORIGIN_REGEX
        value: "^https?://(localhost|127\\.0\\.0\\.1|10\\..+|192\\.168\\..+|172\\.(1[6-9]|2\\d|3[0-1])\\..+)(:\\d+)?$"
      - key: UPSTREAM_429_RETRY_AFTER_SECONDS
        value: "15"
      - key: GEMINI_RETRY_TIMEOUT_SECONDS
        value: "15"
      - key: AUTH_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_STORAGE_BACKEND
        value: gcs
      - key: MEDIA_GCS_BUCKET
        sync: false
      - key: MEDIA_GCS_PREFIX
        value: media
      - key: MEDIA_MAX_UPLOAD_MB
        value: "10"
      - key: MEDIA_RENDER_SIGNING_SECRET
        sync: false
      - key: MEDIA_RENDER_URL_TTL_SECONDS
        value: "86400"
      - key: MEDIA_RENDER_ALLOWED_WIDTHS
        value: "128,256,512,1024"
      - key: MEDIA_RENDER_QUALITY_MIN
        value: "50"
      - key: MEDIA_RENDER_QUALITY_MAX
        value: "85"
      - key: MEDIA_RENDER_DEFAULT_WIDTH
        value: "512"
      - key: MEDIA_RENDER_DEFAULT_QUALITY
        value: "75"
      - key: AUTH_APP_ALLOWED_REDIRECT_URIS
        sync: false
      - key: AUTH_APP_ALLOWED_LOGOUT_REDIRECT_URIS
        sync: false
      - key: AUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_GOOGLE_CODE_VERIFY_ENABLED
        value: "1"
      - key: AUTH_GOOGLE_OAUTH_SCOPE
        value: "openid email profile"
      - key: AUTH_GOOGLE_OAUTH_PROMPT
        value: select_account
      - key: AUTH_KAKAO_CLIENT_ID
        sync: false
      - key: AUTH_KAKAO_CLIENT_SECRET
        sync: false
      - key: AUTH_KAKAO_CODE_VERIFY_ENABLED
        value: "1"
      - key: AUTH_KAKAO_OAUTH_SCOPE
        value: "account_email profile_nickname"
      - key: AUTH_EMAIL_VERIFICATION_REQUIRED
        value: "1"
      - key: AUTH_EMAIL_VERIFICATION_DELIVERY_MODE
        value: smtp
      - key: AUTH_EMAIL_SMTP_HOST
        value: smtp.sendgrid.net
      - key: AUTH_EMAIL_SMTP_PORT
        value: "587"
      - key: AUTH_EMAIL_SMTP_USERNAME
        sync: false
      - key: AUTH_EMAIL_SMTP_PASSWORD
        sync: false
      - key: AUTH_EMAIL_SMTP_STARTTLS
        value: "1"
      - key: AUTH_EMAIL_SMTP_SSL
        value: "0"
      - key: AUTH_EMAIL_SMTP_TIMEOUT_SECONDS
        value: "3"
      - key: AUTH_EMAIL_SMTP_MAX_ATTEMPTS
        value: "1"
      - key: AUTH_EMAIL_SENDER_FROM
        sync: false
      - key: AUTH_EMAIL_SENDER_NAME
        value: FoodLens
      - key: DATAGO_API_KEY
        sync: false
      - key: DATAGO_I2790_API_KEY
        sync: false
      - key: KOREAN_FDA_API_KEY
        sync: false
      - key: PUBLIC_DATA_AUTH_COOLDOWN_SECONDS
        value: "900"
      - key: BARCODE_LOOKUP_CACHE_TTL_SECONDS
        value: "604800"
      - key: BARCODE_LOOKUP_CACHE_MAX_ENTRIES
        value: "1000"
      - key: BARCODE_LOOKUP_CACHE_PATH
        value: "/tmp/foodlens_barcode_lookup_cache.json"
      - key: BARCODE_UPSTREAM_TIMEOUT_SECONDS
        value: "10"
      - key: BARCODE_UPSTREAM_RETRY_COUNT
        value: "2"
      - key: BARCODE_UPSTREAM_RETRY_BACKOFF_SECONDS
        value: "0.6"
      - key: BARCODE_DATAGO_FAILURE_THRESHOLD
        value: "2"
      - key: BARCODE_DATAGO_UNHEALTHY_COOLDOWN_SECONDS
        value: "120"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
