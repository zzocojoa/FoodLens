name: Mobile E2E Release Gate

on:
  pull_request:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodLens
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FoodLens/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run mobile E2E release gate
        run: npm run phase6:mobile-e2e:gate

      - name: Upload mobile E2E release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e-release-gate-${{ github.run_id }}
          path: FoodLens/artifacts/phase6/mobile-e2e-release-gate
          if-no-files-found: error
          retention-days: 14
