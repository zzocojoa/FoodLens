name: Image Hydration Policy

on:
  pull_request:

jobs:
  image-hydration-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate image hydration guardrails
        run: |
          python .github/scripts/validate_image_hydration_policy.py
