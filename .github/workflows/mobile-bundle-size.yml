name: Mobile Bundle Size

on:
  pull_request:
  workflow_dispatch:

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FoodLens
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FoodLens/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prepare mobile performance artifact directory
        run: |
          mkdir -p artifacts/phase6/mobile-bundle-size
          cat > artifacts/phase6/mobile-bundle-size/gate-manifest.json <<'JSON'
          {
            "workflow": "mobile-bundle-size",
            "requiresFreshExport": true,
            "gates": [
              "asset:image:quality:gate",
              "history:runtime:gate",
              "bundle:size:gate"
            ]
          }
          JSON

      - name: Run asset image quality gate
        run: npm run asset:image:quality:gate

      - name: Run History runtime performance gate
        run: npm run history:runtime:gate

      - name: Run mobile bundle size gate
        run: npm run bundle:size:gate -- --require-fresh-export --output-dir artifacts/phase6/mobile-bundle-size/export --summary-file artifacts/phase6/mobile-bundle-size/mobile-bundle-size-summary.json

      - name: Upload mobile bundle size artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-bundle-size-${{ github.run_id }}
          path: FoodLens/artifacts/phase6/mobile-bundle-size
          if-no-files-found: error
          retention-days: 14
