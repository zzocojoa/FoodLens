name: Label Golden Paid Eval

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: "I understand this makes paid Vertex AI calls."
        required: true
        type: boolean
        default: false
      models:
        description: "Comma-separated Gemini model names."
        required: true
        type: string
        default: "gemini-2.5-flash,gemini-2.5-flash-lite"
      sample_limit:
        description: "Maximum active label samples to evaluate."
        required: true
        type: string
        default: "20"
      locale:
        description: "Runtime locale."
        required: true
        type: string
        default: "ko-KR"
      iso_current_country:
        description: "ISO country context."
        required: true
        type: string
        default: "KR"
      allergy_info:
        description: "Synthetic allergy profile text for the eval run."
        required: true
        type: string
        default: "peanut, milk, shellfish"
      fail_on_regression:
        description: "Exit non-zero when configured regression thresholds fail."
        required: true
        type: boolean
        default: true
      min_success_rate:
        description: "Minimum parsed success rate per model."
        required: true
        type: string
        default: "0.20"
      min_expected_status_match_rate:
        description: "Minimum safety status match rate per model."
        required: true
        type: string
        default: "0.80"
      min_ingredients_pass_rate:
        description: "Minimum ingredient lower-bound pass rate per model."
        required: true
        type: string
        default: "0.40"
      min_nutrition_keys_pass_rate:
        description: "Minimum nutrition required-key pass rate per model."
        required: true
        type: string
        default: "0.40"
      max_max_tokens_rate:
        description: "Maximum MAX_TOKENS finish rate per model."
        required: true
        type: string
        default: "0.50"
      min_allergen_recall_rate:
        description: "Minimum reviewed-sample allergen recall rate per model."
        required: true
        type: string
        default: "0.50"
      min_risk_ingredient_recall_rate:
        description: "Minimum reviewed-sample risk ingredient recall rate per model."
        required: true
        type: string
        default: "0.20"
      max_paid_calls:
        description: "Maximum estimated Vertex generate_content calls allowed."
        required: true
        type: string
        default: "80"

permissions:
  contents: read

jobs:
  paid-eval-confirmation-guard:
    if: ${{ !inputs.confirm_paid }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unconfirmed paid eval
        run: |
          echo "Set confirm_paid=true to run paid Vertex AI label golden eval."
          exit 1

  paid-eval-ref-guard:
    if: ${{ inputs.confirm_paid && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unsupported paid eval ref
        run: |
          echo "Paid label golden eval can only run from main or release/** refs."
          exit 1

  paid-vertex-label-golden-eval:
    if: ${{ inputs.confirm_paid && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: paid-ai-eval
    env:
      ALLOW_VERTEX_LABEL_GOLDEN_EVAL: "1"
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      LABEL_GOLDEN_OUTPUT_ROOT: artifacts/label-golden-eval
      LABEL_GOLDEN_UPLOAD_ROOT: artifacts/label-golden-eval-upload
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate paid eval secrets
        run: |
          test -n "${GCP_PROJECT_ID}" || { echo "GCP_PROJECT_ID secret or variable is required."; exit 1; }
          test -n "${GCP_SERVICE_ACCOUNT_JSON}" || { echo "GCP_SERVICE_ACCOUNT_JSON secret is required."; exit 1; }

      - name: Run paid Vertex label golden eval
        id: paid_eval
        continue-on-error: true
        run: |
          mkdir -p "${LABEL_GOLDEN_OUTPUT_ROOT}"
          FAIL_ARG=""
          if [[ "${{ inputs.fail_on_regression }}" == "true" ]]; then
            FAIL_ARG="--fail-on-regression"
          fi
          python backend/scripts/run_label_golden_model_eval.py \
            --models "${{ inputs.models }}" \
            --allergy-info "${{ inputs.allergy_info }}" \
            --locale "${{ inputs.locale }}" \
            --iso-current-country "${{ inputs.iso_current_country }}" \
            --output-root "${LABEL_GOLDEN_OUTPUT_ROOT}" \
            --sample-limit "${{ inputs.sample_limit }}" \
            --min-success-rate "${{ inputs.min_success_rate }}" \
            --min-expected-status-match-rate "${{ inputs.min_expected_status_match_rate }}" \
            --min-ingredients-pass-rate "${{ inputs.min_ingredients_pass_rate }}" \
            --min-nutrition-keys-pass-rate "${{ inputs.min_nutrition_keys_pass_rate }}" \
            --max-max-tokens-rate "${{ inputs.max_max_tokens_rate }}" \
            --min-allergen-recall-rate "${{ inputs.min_allergen_recall_rate }}" \
            --min-risk-ingredient-recall-rate "${{ inputs.min_risk_ingredient_recall_rate }}" \
            --max-paid-calls "${{ inputs.max_paid_calls }}" \
            ${FAIL_ARG}

      - name: Prepare upload-safe label golden summaries
        if: always()
        run: |
          mkdir -p "${LABEL_GOLDEN_UPLOAD_ROOT}"
          find "${LABEL_GOLDEN_OUTPUT_ROOT}" -name summary.json -print0 | while IFS= read -r -d '' summary_path; do
            run_dir="$(basename "$(dirname "${summary_path}")")"
            mkdir -p "${LABEL_GOLDEN_UPLOAD_ROOT}/${run_dir}"
            cp "${summary_path}" "${LABEL_GOLDEN_UPLOAD_ROOT}/${run_dir}/summary.json"
          done

      - name: Scan label golden eval summaries for secret leaks
        id: artifact_secret_scan
        if: always()
        run: python .github/scripts/scan_artifact_secrets.py "${LABEL_GOLDEN_UPLOAD_ROOT}"

      - name: Upload label golden eval summary artifacts
        if: ${{ always() && steps.artifact_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: label-golden-eval-summary-${{ github.run_id }}
          path: artifacts/label-golden-eval-upload
          if-no-files-found: error
          retention-days: 14

      - name: Fail if paid eval failed
        if: ${{ steps.paid_eval.outcome != 'success' }}
        run: exit 1
