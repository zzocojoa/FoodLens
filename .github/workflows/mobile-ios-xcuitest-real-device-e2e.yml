name: Mobile iOS XCUITest Real Device E2E

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: "Connected physical iPhone UDID"
        required: true
        type: string
      runs_on_json:
        description: "JSON array for a self-hosted macOS runner with a real iPhone"
        required: true
        default: '["self-hosted","macOS"]'
        type: string
      skip_prebuild:
        description: "Skip Expo prebuild and pod install when ios/ is already prepared on the runner"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  mobile-ios-xcuitest-e2e:
    name: mobile-ios-xcuitest-e2e
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    defaults:
      run:
        working-directory: FoodLens
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FoodLens/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run iOS XCUITest real-device release smoke
        env:
          FOODLENS_E2E_DEVICE_ID: ${{ inputs.device_id }}
          FOODLENS_E2E_EMAIL: ${{ secrets.PHASE6_POSTDEPLOY_SMOKE_EMAIL }}
          FOODLENS_E2E_PASSWORD: ${{ secrets.PHASE6_POSTDEPLOY_SMOKE_PASSWORD }}
          FOODLENS_XCUITEST_SKIP_PREBUILD: ${{ inputs.skip_prebuild && '1' || '0' }}
        run: npm run phase6:mobile-ios-xcuitest:e2e

      - name: Upload iOS XCUITest E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-xcuitest-e2e-${{ github.run_id }}
          path: FoodLens/artifacts/phase6/mobile-ios-xcuitest-e2e
          if-no-files-found: error
          retention-days: 14
