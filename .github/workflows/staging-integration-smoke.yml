name: Staging Integration Smoke

on:
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  staging-integration-smoke-ref-guard:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unsupported staging smoke ref
        run: |
          echo "Staging smoke can only run from main or release/** refs."
          exit 1

  staging-integration-smoke-pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate staging smoke automation
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/staging-integration-smoke.yml").read_text(encoding="utf-8")
          required_markers = [
              "pull_request:",
              "environment: staging",
              "permissions:\n  contents: read",
              "secrets.STAGING_RENDER_API_KEY",
              "secrets.STAGING_RENDER_SERVICE_ID",
              "render_deploy_ready_gate.py",
              "render_one_off_job_gate.py",
              "Scan staging smoke artifacts for secret leaks",
              "Upload staging smoke artifacts",
          ]
          missing_markers = [marker for marker in required_markers if marker not in workflow]
          if missing_markers:
              raise SystemExit(f"Missing staging smoke workflow markers: {missing_markers}")
          if workflow.index("Scan staging smoke artifacts for secret leaks") > workflow.index("Upload staging smoke artifacts"):
              raise SystemExit("Artifact upload must run after the secret scan.")
          PY

  staging-integration-smoke:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
      RENDER_DEPLOY_MIN_CREATED_AT: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
      RENDER_DEPLOY_TIMEOUT_SECONDS: "900"
      RENDER_DEPLOY_POLL_SECONDS: "10"
      RENDER_DEPLOY_SUMMARY_PATH: artifacts/phase6/staging-integration-smoke/render-deploy-ready-summary.json
      RENDER_JOB_TIMEOUT_SECONDS: "900"
      RENDER_JOB_POLL_SECONDS: "10"
      RENDER_JOB_LOG_WAIT_SECONDS: "60"
      RENDER_JOB_SUMMARY_PATH: artifacts/phase6/staging-integration-smoke/render-one-off-job-summary.json
      RENDER_JOB_LOG_PATH: artifacts/phase6/staging-integration-smoke/render-one-off-job.log
      RENDER_START_COMMAND: >-
        env
        OPENAPI_EXPORT_ONLY=1
        AUTH_EMAIL_VERIFICATION_REQUIRED=1
        AUTH_EMAIL_VERIFICATION_DEBUG_CODE_ENABLED=1
        AUTH_EMAIL_VERIFICATION_DELIVERY_MODE=log
        AUTH_STATE_BACKEND=postgres
        RETENTION_STORE_BACKEND=postgres
        RETENTION_DELETE_BACKEND=media_asset
        MEDIA_STORAGE_BACKEND=gcs
        DELETION_QUEUE_BACKEND=postgres
        DELETION_HANDLER_BACKEND=user
        MEDIA_GCS_PREFIX=media
        MEDIA_MAX_UPLOAD_MB=10
        STAGING_SMOKE_ARTIFACT_DIR=/tmp/foodlens-staging-integration-smoke
        python backend/scripts/staging_integration_smoke.py

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Wait for Render deploy readiness
        run: python .github/scripts/render_deploy_ready_gate.py

      - name: Run Render one-off staging integration smoke
        run: python .github/scripts/render_one_off_job_gate.py

      - name: Scan staging smoke artifacts for secret leaks
        id: artifact_secret_scan
        if: always()
        run: python .github/scripts/scan_artifact_secrets.py artifacts/phase6/staging-integration-smoke

      - name: Upload staging smoke artifacts
        if: ${{ always() && steps.artifact_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-integration-smoke-${{ github.run_id }}
          path: artifacts/phase6/staging-integration-smoke
          if-no-files-found: error
          retention-days: 14
