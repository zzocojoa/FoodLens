name: Backend Media Performance Regression

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - "release/**"
  release:
    types:
      - prereleased
      - published
  workflow_dispatch:
    inputs:
      release_label:
        description: "Release label or release candidate identifier"
        required: false
        type: string
      backend_base_url:
        description: "Deployed backend public base URL; leave empty to use PERF_BACKEND_BASE_URL variable/secret"
        required: false
        type: string
      media_render_url:
        description: "Signed media render URL; leave empty to use PERF_MEDIA_RENDER_URL secret"
        required: false
        type: string
      media_render_cache_hit_url:
        description: "Signed cache-hit media render URL; leave empty to use PERF_MEDIA_RENDER_CACHE_HIT_URL secret"
        required: false
        type: string
      media_render_cache_miss_urls:
        description: "Comma-separated signed cache-miss media render URLs; leave empty to use PERF_MEDIA_RENDER_CACHE_MISS_URLS secret"
        required: false
        type: string
      baseline_summary_path:
        description: "Checked-out or downloaded baseline summary.json path; required unless baseline artifact vars are configured"
        required: false
        type: string
      baseline_summary_artifact_run_id:
        description: "Prior workflow run id containing the baseline artifact; required unless baseline path is configured"
        required: false
        type: string
      baseline_summary_artifact_name:
        description: "Artifact name containing a baseline summary.json; required unless baseline path is configured"
        required: false
        type: string
      enable_analyze:
        description: "Include /analyze/label requests when ANALYZE_PATH is available"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      analyze_path:
        description: "Repository path to JPEG fixture for ENABLE_ANALYZE=1"
        required: false
        type: string
      validate_only:
        description: "Validate workflow scripts without live backend secrets"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      require_cache_header:
        description: "Require X-Media-Render-Cache hit/miss/disabled headers"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  actions: read
  contents: read

jobs:
  backend-media-performance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve performance gate inputs
        id: resolve-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_RELEASE_LABEL: ${{ inputs.release_label }}
          INPUT_BACKEND_BASE_URL: ${{ inputs.backend_base_url }}
          INPUT_MEDIA_RENDER_URL: ${{ inputs.media_render_url }}
          INPUT_MEDIA_RENDER_CACHE_HIT_URL: ${{ inputs.media_render_cache_hit_url }}
          INPUT_MEDIA_RENDER_CACHE_MISS_URLS: ${{ inputs.media_render_cache_miss_urls }}
          INPUT_BASELINE_SUMMARY_PATH: ${{ inputs.baseline_summary_path }}
          INPUT_BASELINE_SUMMARY_ARTIFACT_RUN_ID: ${{ inputs.baseline_summary_artifact_run_id }}
          INPUT_BASELINE_SUMMARY_ARTIFACT_NAME: ${{ inputs.baseline_summary_artifact_name }}
          INPUT_ENABLE_ANALYZE: ${{ inputs.enable_analyze }}
          INPUT_ANALYZE_PATH: ${{ inputs.analyze_path }}
          INPUT_VALIDATE_ONLY: ${{ inputs.validate_only }}
          INPUT_REQUIRE_CACHE_HEADER: ${{ inputs.require_cache_header }}
          VAR_BACKEND_BASE_URL: ${{ vars.PERF_BACKEND_BASE_URL }}
          SECRET_BACKEND_BASE_URL: ${{ secrets.PERF_BACKEND_BASE_URL }}
          VAR_BASELINE_SUMMARY_PATH: ${{ vars.PERF_BASELINE_SUMMARY_PATH }}
          VAR_BASELINE_SUMMARY_ARTIFACT_RUN_ID: ${{ vars.PERF_BASELINE_SUMMARY_ARTIFACT_RUN_ID }}
          VAR_BASELINE_SUMMARY_ARTIFACT_NAME: ${{ vars.PERF_BASELINE_SUMMARY_ARTIFACT_NAME }}
        run: |
          set -euo pipefail

          assert_single_line_value() {
            local name="${1}"
            local value="${2}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "${name} must be a single-line value."
              exit 1
            fi
          }

          write_env_value() {
            local name="${1}"
            local value="${2}"
            assert_single_line_value "${name}" "${value}"
            printf '%s=%s\n' "${name}" "${value}" >> "${GITHUB_ENV}"
          }

          write_output_value() {
            local name="${1}"
            local value="${2}"
            assert_single_line_value "${name}" "${value}"
            printf '%s=%s\n' "${name}" "${value}" >> "${GITHUB_OUTPUT}"
          }

          choose_first_value() {
            for candidate in "$@"; do
              if [[ -n "${candidate}" ]]; then
                printf '%s' "${candidate}"
                return 0
              fi
            done
            printf ''
          }

          default_release_label="run-${GITHUB_RUN_ID}"
          if [[ "${EVENT_NAME:-}" == "pull_request" && -n "${EVENT_PR_NUMBER:-}" ]]; then
            default_release_label="pr-${EVENT_PR_NUMBER}"
          elif [[ "${EVENT_NAME:-}" == "release" && -n "${EVENT_RELEASE_TAG:-}" ]]; then
            default_release_label="${EVENT_RELEASE_TAG}"
          fi

          release_label="$(choose_first_value "${INPUT_RELEASE_LABEL:-}" "${default_release_label}")"
          backend_base_url="$(choose_first_value "${INPUT_BACKEND_BASE_URL:-}" "${VAR_BACKEND_BASE_URL:-}" "${SECRET_BACKEND_BASE_URL:-}")"
          baseline_summary_path="$(choose_first_value "${INPUT_BASELINE_SUMMARY_PATH:-}" "${VAR_BASELINE_SUMMARY_PATH:-}")"
          baseline_summary_artifact_run_id="$(choose_first_value "${INPUT_BASELINE_SUMMARY_ARTIFACT_RUN_ID:-}" "${VAR_BASELINE_SUMMARY_ARTIFACT_RUN_ID:-}")"
          baseline_summary_artifact_name="$(choose_first_value "${INPUT_BASELINE_SUMMARY_ARTIFACT_NAME:-}" "${VAR_BASELINE_SUMMARY_ARTIFACT_NAME:-}")"
          enable_analyze="$(choose_first_value "${INPUT_ENABLE_ANALYZE:-}" "0")"
          validate_only="$(choose_first_value "${INPUT_VALIDATE_ONLY:-}" "0")"
          require_cache_header="$(choose_first_value "${INPUT_REQUIRE_CACHE_HEADER:-}" "0")"

          if [[ "${validate_only}" != "0" && "${validate_only}" != "1" ]]; then
            echo "validate_only must be 0 or 1."
            exit 1
          fi
          if [[ "${validate_only}" != "1" && -z "${backend_base_url}" ]]; then
            echo "backend_base_url input or PERF_BACKEND_BASE_URL variable/secret is required."
            exit 1
          fi
          if [[ "${validate_only}" != "1" && -z "${baseline_summary_path}" && ( -z "${baseline_summary_artifact_run_id}" || -z "${baseline_summary_artifact_name}" ) ]]; then
            echo "A baseline summary is required: set baseline_summary_path or both PERF_BASELINE_SUMMARY_ARTIFACT_RUN_ID and PERF_BASELINE_SUMMARY_ARTIFACT_NAME."
            exit 1
          fi
          if [[ "${enable_analyze}" != "0" && "${enable_analyze}" != "1" ]]; then
            echo "enable_analyze must be 0 or 1."
            exit 1
          fi
          if [[ "${require_cache_header}" != "0" && "${require_cache_header}" != "1" ]]; then
            echo "require_cache_header must be 0 or 1."
            exit 1
          fi

          write_env_value "PHASE6_RELEASE_LABEL" "${release_label}"
          write_env_value "BASE_URL" "${backend_base_url}"
          write_env_value "PERF_INPUT_MEDIA_RENDER_URL" "${INPUT_MEDIA_RENDER_URL:-}"
          write_env_value "PERF_INPUT_MEDIA_RENDER_CACHE_HIT_URL" "${INPUT_MEDIA_RENDER_CACHE_HIT_URL:-}"
          write_env_value "PERF_INPUT_MEDIA_RENDER_CACHE_MISS_URLS" "${INPUT_MEDIA_RENDER_CACHE_MISS_URLS:-}"
          write_env_value "BASELINE_SUMMARY_PATH" "${baseline_summary_path}"
          write_env_value "BASELINE_SUMMARY_ARTIFACT_RUN_ID" "${baseline_summary_artifact_run_id}"
          write_env_value "BASELINE_SUMMARY_ARTIFACT_NAME" "${baseline_summary_artifact_name}"
          write_env_value "ENABLE_ANALYZE" "${enable_analyze}"
          write_env_value "ANALYZE_PATH" "${INPUT_ANALYZE_PATH:-}"
          write_env_value "PERF_VALIDATE_ONLY" "${validate_only}"
          write_env_value "REQUIRE_MEDIA_RENDER_CACHE_HEADER" "${require_cache_header}"
          write_output_value "validate_only" "${validate_only}"

      - name: Validate performance tooling without live secrets
        if: ${{ steps.resolve-inputs.outputs.validate_only == '1' }}
        run: |
          set -euo pipefail
          validate_dir="artifacts/perf/backend-media-validate-only"

          bash -n scripts/perf/run-media-baseline.sh
          python3 -m py_compile scripts/perf/compare-media-summaries.py
          MEDIA_RENDER_URL="https://example.invalid/media/render/validate-hit?exp=1&sig=validate" \
            MEDIA_RENDER_CACHE_MISS_URLS="https://example.invalid/media/render/validate-miss?exp=1&sig=validate" \
            PERF_VALIDATE_ONLY=1 \
            OUT_DIR="${validate_dir}" \
            bash scripts/perf/run-media-baseline.sh
          python3 - "${validate_dir}/baseline-summary.json" "${validate_dir}/summary.json" <<'PY'
          import json
          import sys

          baseline_path, summary_path = sys.argv[1:]
          summary = {
              "metrics": {
                  "http_req_failed": {"values": {"rate": 0.0}},
                  "render_failure_rate": {"values": {"rate": 0.0}},
                  "render_latency": {"values": {"p(95)": 100.0}},
                  "render_cache_hit_failure_rate": {"values": {"rate": 0.0}},
                  "render_cache_hit_latency": {"values": {"p(95)": 100.0}},
                  "render_cache_miss_failure_rate": {"values": {"rate": 0.0}},
                  "render_cache_miss_latency": {"values": {"p(95)": 200.0}},
                  "render_cache_miss_observed_rate": {"values": {"rate": 1.0}},
                  "render_cache_miss_observed_count": {"values": {"count": 15.0}},
                  "render_cache_disabled_rate": {"values": {"rate": 0.0}},
                  "render_cache_unknown_rate": {"values": {"rate": 0.0}},
              }
          }
          for path in (baseline_path, summary_path):
              with open(path, "w", encoding="utf-8") as handle:
                  json.dump(summary, handle, sort_keys=True)
                  handle.write("\n")
          PY
          python3 scripts/perf/compare-media-summaries.py \
            --before "${validate_dir}/baseline-summary.json" \
            --after "${validate_dir}/summary.json" \
            --fail-on-regression \
            --enforce-thresholds \
            --require-cache-header \
            --require-metric render_cache_hit_failure_rate.rate \
            --require-metric "render_cache_hit_latency.p(95)" \
            --require-metric render_cache_disabled_rate.rate \
            --require-metric render_cache_unknown_rate.rate \
            --require-metric render_cache_miss_failure_rate.rate \
            --require-metric "render_cache_miss_latency.p(95)"

      - name: Install k6
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Resolve fresh media render URL
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        env:
          SECRET_MEDIA_RENDER_URL: ${{ secrets.PERF_MEDIA_RENDER_URL }}
          SECRET_MEDIA_RENDER_CACHE_HIT_URL: ${{ secrets.PERF_MEDIA_RENDER_CACHE_HIT_URL }}
          SECRET_MEDIA_RENDER_CACHE_MISS_URLS: ${{ secrets.PERF_MEDIA_RENDER_CACHE_MISS_URLS }}
          PERF_AUTH_BEARER_TOKEN: ${{ secrets.PERF_AUTH_BEARER_TOKEN }}
          SMOKE_EMAIL: ${{ secrets.PHASE6_POSTDEPLOY_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PHASE6_POSTDEPLOY_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail

          diagnostics_path="artifacts/perf/url-resolution/diagnostics.jsonl"
          mkdir -p "$(dirname "${diagnostics_path}")"
          : > "${diagnostics_path}"

          assert_single_line_value() {
            local name="${1}"
            local value="${2}"
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "${name} must be a single-line value."
              exit 1
            fi
          }

          mask_workflow_value() {
            local value="${1}"
            value="${value//%/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '::add-mask::%s\n' "${value}"
          }

          INPUT_MEDIA_RENDER_URL="${PERF_INPUT_MEDIA_RENDER_URL}"

          write_optional_cache_split_urls() {
            local cache_hit_url="${PERF_INPUT_MEDIA_RENDER_CACHE_HIT_URL:-${SECRET_MEDIA_RENDER_CACHE_HIT_URL:-}}"
            local cache_miss_urls="${PERF_INPUT_MEDIA_RENDER_CACHE_MISS_URLS:-${SECRET_MEDIA_RENDER_CACHE_MISS_URLS:-}}"

            if [[ -n "${cache_hit_url}" && "${cache_hit_url}" == "${cache_miss_urls}" ]]; then
              echo "cache-hit and cache-miss media render URLs must be different."
              exit 1
            fi
            if [[ -n "${cache_hit_url}" ]]; then
              assert_single_line_value "media_render_cache_hit_url" "${cache_hit_url}"
              mask_workflow_value "${cache_hit_url}"
              printf 'MEDIA_RENDER_CACHE_HIT_URL=%s\n' "${cache_hit_url}" >> "${GITHUB_ENV}"
              echo "MEDIA_RENDER_CACHE_HIT_URL source: configured"
            fi
            if [[ -n "${cache_miss_urls}" ]]; then
              assert_single_line_value "media_render_cache_miss_urls" "${cache_miss_urls}"
              mask_workflow_value "${cache_miss_urls}"
              printf 'MEDIA_RENDER_CACHE_MISS_URLS=%s\n' "${cache_miss_urls}" >> "${GITHUB_ENV}"
              echo "MEDIA_RENDER_CACHE_MISS_URLS source: configured"
            fi
          }

          if [[ -n "${INPUT_MEDIA_RENDER_URL}" ]]; then
            assert_single_line_value "media_render_url" "${INPUT_MEDIA_RENDER_URL}"
            mask_workflow_value "${INPUT_MEDIA_RENDER_URL}"
            printf 'MEDIA_RENDER_URL=%s\n' "${INPUT_MEDIA_RENDER_URL}" >> "${GITHUB_ENV}"
            write_optional_cache_split_urls
            if [[ -n "${PERF_AUTH_BEARER_TOKEN}" ]]; then
              assert_single_line_value "PERF_AUTH_BEARER_TOKEN" "${PERF_AUTH_BEARER_TOKEN}"
              mask_workflow_value "${PERF_AUTH_BEARER_TOKEN}"
              printf 'AUTH_BEARER_TOKEN=%s\n' "${PERF_AUTH_BEARER_TOKEN}" >> "${GITHUB_ENV}"
            fi
            echo "MEDIA_RENDER_URL source: workflow input"
            exit 0
          fi

          if [[ -n "${SECRET_MEDIA_RENDER_URL}" ]]; then
            assert_single_line_value "PERF_MEDIA_RENDER_URL" "${SECRET_MEDIA_RENDER_URL}"
            mask_workflow_value "${SECRET_MEDIA_RENDER_URL}"
            printf 'MEDIA_RENDER_URL=%s\n' "${SECRET_MEDIA_RENDER_URL}" >> "${GITHUB_ENV}"
            write_optional_cache_split_urls
            if [[ -n "${PERF_AUTH_BEARER_TOKEN}" ]]; then
              assert_single_line_value "PERF_AUTH_BEARER_TOKEN" "${PERF_AUTH_BEARER_TOKEN}"
              mask_workflow_value "${PERF_AUTH_BEARER_TOKEN}"
              printf 'AUTH_BEARER_TOKEN=%s\n' "${PERF_AUTH_BEARER_TOKEN}" >> "${GITHUB_ENV}"
            fi
            echo "MEDIA_RENDER_URL source: PERF_MEDIA_RENDER_URL secret"
            exit 0
          fi

          token="${PERF_AUTH_BEARER_TOKEN}"
          if [[ -n "${token}" ]]; then
            assert_single_line_value "PERF_AUTH_BEARER_TOKEN" "${token}"
            mask_workflow_value "${token}"
            echo "AUTH_BEARER_TOKEN source: PERF_AUTH_BEARER_TOKEN secret"
          else
            if [[ -z "${SMOKE_EMAIL}" || -z "${SMOKE_PASSWORD}" ]]; then
              echo "Provide media_render_url/PERF_MEDIA_RENDER_URL, PERF_AUTH_BEARER_TOKEN, or PHASE6_POSTDEPLOY_SMOKE_EMAIL/PASSWORD."
              exit 1
            fi

            login_request="$(
              python3 - "${SMOKE_EMAIL}" "${SMOKE_PASSWORD}" <<'PY'
          import json
          import sys

          print(json.dumps({"email": sys.argv[1], "password": sys.argv[2]}))
          PY
            )"
            login_body="${RUNNER_TEMP}/perf-auth-login.body"
            login_curl_exit=0
            login_status="$(
              curl -sS --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 1 --retry-all-errors \
                -H "Content-Type: application/json" \
                -o "${login_body}" \
                -w '%{http_code}' \
                -X POST \
                -d "${login_request}" \
                "${BASE_URL%/}/auth/email/login"
            )" || login_curl_exit=$?
            if [[ "${login_curl_exit}" != "0" ]]; then
              echo "auth/email/login curl failed: exit_code=${login_curl_exit}"
              exit 1
            fi
            if [[ "${login_status}" != "200" ]]; then
              echo "auth/email/login expected 200, got ${login_status}"
              exit 1
            fi
            token="$(
              python3 - "${login_body}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          candidate = str(payload.get("access_token") or payload.get("token") or "").strip()
          if not candidate:
              auth = payload.get("auth") if isinstance(payload.get("auth"), dict) else {}
              candidate = str(auth.get("access_token") or auth.get("token") or "").strip()
          if not candidate:
              raise SystemExit("auth/email/login response did not include an access token")
          print(candidate)
          PY
            )"
            assert_single_line_value "AUTH_BEARER_TOKEN" "${token}"
            mask_workflow_value "${token}"
            echo "AUTH_BEARER_TOKEN source: smoke account login"
          fi

          write_diagnostic() {
            local attempt="${1}"
            local candidate_source="${2}"
            local status="${3}"
            local content_type="${4}"
            local detail_code="${5}"
            local request_id="${6}"
            local recovered="${7}"
            local timestamp
            timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            python3 - "${diagnostics_path}" "${timestamp}" "${attempt}" "${candidate_source}" "${status}" "${content_type}" "${detail_code}" "${request_id}" "${recovered}" <<'PY'
          import json
          import re
          import sys

          path, timestamp, attempt, candidate_source, status, content_type, detail_code, request_id, recovered = sys.argv[1:]

          safe_value_pattern = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:/@=+; \[\]-]{0,199}$")

          def safe_diagnostic_value(value: str) -> str:
              text = str(value or "").strip()
              lowered = text.lower()
              if not text:
                  return ""
              if "://" in text or "?" in text or "authorization" in lowered or "bearer " in lowered or "sig=" in lowered:
                  return "redacted"
              if not safe_value_pattern.fullmatch(text):
                  return "redacted"
              return text

          event = {
              "timestamp": timestamp,
              "attempt": int(attempt),
              "candidate_source": safe_diagnostic_value(candidate_source),
              "status": safe_diagnostic_value(status),
              "content_type": safe_diagnostic_value(content_type),
              "detail": {"code": safe_diagnostic_value(detail_code)},
              "request_id": safe_diagnostic_value(request_id),
              "recovered": recovered == "true",
          }
          with open(path, "a", encoding="utf-8") as handle:
              handle.write(json.dumps(event, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          }

          request_id_from_headers() {
            local headers_path="${1}"
            awk '
              /^[[:space:]]*[^:]+:[[:space:]]*/ {
                header = tolower($0)
                if (header !~ /^[[:space:]]*(x-request-id|request-id|x-amzn-requestid|cf-ray):[[:space:]]*/) {
                  next
                }
                sub(/^[^:]+:[[:space:]]*/, "", $0)
                sub(/[[:space:]\r]+$/, "", $0)
                print $0
                exit
              }
            ' "${headers_path}"
          }

          diagnostic_detail_from_body() {
            local body_path="${1}"
            python3 - "${body_path}" <<'PY'
          import json
          import sys

          body_path = sys.argv[1]
          detail_code = ""
          request_id = ""
          try:
              with open(body_path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              print("\t")
              raise SystemExit(0)

          detail = payload.get("detail") if isinstance(payload, dict) else None
          if isinstance(detail, dict):
              detail_code = str(detail.get("code") or "").strip()
              request_id = str(detail.get("request_id") or "").strip()
          print(f"{detail_code}\t{request_id}")
          PY
          }

          is_retryable_curl_exit() {
            local curl_exit="${1}"
            case "${curl_exit}" in
              5|6|7|18|28|35|52|55|56|92)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_transient_failure() {
            local status="${1}"
            local curl_exit="${2}"
            if [[ "${status}" == "502" || "${status}" == "503" || "${status}" == "504" ]]; then
              return 0
            fi
            is_retryable_curl_exit "${curl_exit}"
          }

          fetch_json_endpoint() {
            local endpoint_name="${1}"
            local url="${2}"
            local body_path="${3}"
            local attempt="${4}"
            local headers_path="${RUNNER_TEMP}/perf-${endpoint_name}-${attempt}.headers"
            local meta_path="${RUNNER_TEMP}/perf-${endpoint_name}-${attempt}.meta"
            local status=""
            local content_type=""
            local detail_code=""
            local request_id=""
            local body_request_id=""
            local curl_exit=0

            : > "${headers_path}"
            : > "${meta_path}"
            curl -sS --connect-timeout 15 --max-time 30 \
              -H "Authorization: Bearer ${token}" \
              -D "${headers_path}" \
              -o "${body_path}" \
              -w '%{http_code}\t%{content_type}\n' \
              "${url}" > "${meta_path}" || curl_exit=$?
            IFS=$'\t' read -r status content_type < "${meta_path}" || true
            request_id="$(request_id_from_headers "${headers_path}")"
            IFS=$'\t' read -r detail_code body_request_id < <(diagnostic_detail_from_body "${body_path}") || true
            if [[ -z "${request_id}" ]]; then
              request_id="${body_request_id}"
            fi
            write_diagnostic "${attempt}" "${endpoint_name}" "${status}" "${content_type}" "${detail_code}" "${request_id}" "${transient_seen}"

            if [[ "${curl_exit}" == "0" && "${status}" == "200" ]]; then
              return 0
            fi
            if is_transient_failure "${status}" "${curl_exit}"; then
              transient_seen="true"
              return 75
            fi
            echo "${endpoint_name} expected 200, got ${status}"
            return 1
          }

          collect_candidates() {
            local profile_body="${1}"
            local history_body="${2}"
            python3 - "${profile_body}" "${history_body}" <<'PY'
          import json
          import sys
          from urllib.parse import parse_qs, urlparse

          profile_path = sys.argv[1]
          history_path = sys.argv[2]

          with open(profile_path, "r", encoding="utf-8") as handle:
              profile_payload = json.load(handle)
          with open(history_path, "r", encoding="utf-8") as handle:
              history_payload = json.load(handle)

          def signed_remote_render_url(value: object) -> str:
              candidate = str(value or "").strip()
              if "\n" in candidate or "\r" in candidate or "\t" in candidate:
                  return ""
              parsed = urlparse(candidate)
              query = parse_qs(parsed.query)
              if parsed.scheme in {"http", "https"} and parsed.netloc and "/media/render/" in parsed.path and query.get("exp") and query.get("sig"):
                  return candidate
              return ""

          history_items = history_payload.get("history") if isinstance(history_payload, dict) else []
          if isinstance(history_items, list):
              for index, item in enumerate(history_items):
                  if not isinstance(item, dict):
                      continue
                  entry = item.get("entry") if isinstance(item.get("entry"), dict) else item
                  candidate = signed_remote_render_url(entry.get("image_render_url"))
                  if candidate:
                      print(f"history[{index}].image_render_url\t{candidate}")

          profile = profile_payload.get("profile") if isinstance(profile_payload, dict) else {}
          if isinstance(profile, dict):
              candidate = signed_remote_render_url(profile.get("profile_image_render_url"))
              if candidate:
                  print(f"profile.profile_image_render_url\t{candidate}")
          PY
          }

          selected_source=""
          selected_url=""
          transient_seen="false"
          max_attempts=3

          for attempt in $(seq 1 "${max_attempts}"); do
            profile_body="${RUNNER_TEMP}/perf-me-profile-${attempt}.body"
            history_body="${RUNNER_TEMP}/perf-me-history-${attempt}.body"
            fetch_retryable="false"

            if fetch_json_endpoint "profile" "${BASE_URL%/}/me/profile" "${profile_body}" "${attempt}"; then
              :
            else
              fetch_status=$?
              if [[ "${fetch_status}" == "75" && "${attempt}" != "${max_attempts}" ]]; then
                fetch_retryable="true"
              elif [[ "${fetch_status}" == "75" ]]; then
                echo "profile request transient failure after ${max_attempts} attempts."
                exit 1
              else
                exit "${fetch_status}"
              fi
            fi
            if [[ "${fetch_retryable}" == "false" ]]; then
              if fetch_json_endpoint "history" "${BASE_URL%/}/me/history?limit=20" "${history_body}" "${attempt}"; then
                :
              else
                fetch_status=$?
                if [[ "${fetch_status}" == "75" && "${attempt}" != "${max_attempts}" ]]; then
                  fetch_retryable="true"
                elif [[ "${fetch_status}" == "75" ]]; then
                  echo "history request transient failure after ${max_attempts} attempts."
                  exit 1
                else
                  exit "${fetch_status}"
                fi
              fi
            fi

            if [[ "${fetch_retryable}" == "true" ]]; then
              sleep "${attempt}"
              continue
            fi

            candidates="$(collect_candidates "${profile_body}" "${history_body}")"
            if [[ -z "${candidates}" ]]; then
              echo "Smoke account has no signed /media/render URL in /me/history or /me/profile."
              exit 1
            fi

            probe_retryable="false"
            while IFS=$'\t' read -r candidate_source candidate_url; do
              if [[ -z "${candidate_url}" ]]; then
                continue
              fi
              mask_workflow_value "${candidate_url}"
              probe_meta="${RUNNER_TEMP}/perf-render-probe-${attempt}.meta"
              probe_headers="${RUNNER_TEMP}/perf-render-probe-${attempt}.headers"
              probe_body="${RUNNER_TEMP}/perf-render-probe-${attempt}.body"
              probe_curl_exit=0
              probe_detail_code=""
              : > "${probe_headers}"
              : > "${probe_meta}"
              curl -sS --connect-timeout 15 --max-time 30 \
                -H "Accept: image/webp,image/*,*/*;q=0.8" \
                -D "${probe_headers}" \
                -o "${probe_body}" \
                -w '%{http_code}\t%{content_type}\n' \
                "${candidate_url}" > "${probe_meta}" || probe_curl_exit=$?
              IFS=$'\t' read -r probe_status probe_content_type < "${probe_meta}" || true
              probe_request_id="$(request_id_from_headers "${probe_headers}")"
              IFS=$'\t' read -r probe_detail_code probe_body_request_id < <(diagnostic_detail_from_body "${probe_body}") || true
              if [[ -z "${probe_request_id}" ]]; then
                probe_request_id="${probe_body_request_id}"
              fi
              if [[ "${probe_curl_exit}" == "0" && "${probe_status}" == "200" && "${probe_content_type}" == image/* ]]; then
                write_diagnostic "${attempt}" "${candidate_source}" "${probe_status}" "${probe_content_type}" "${probe_detail_code}" "${probe_request_id}" "${transient_seen}"
                selected_source="${candidate_source}"
                selected_url="${candidate_url}"
                break
              fi
              write_diagnostic "${attempt}" "${candidate_source}" "${probe_status}" "${probe_content_type}" "${probe_detail_code}" "${probe_request_id}" "false"
              echo "Skipped render URL candidate ${candidate_source}: status=${probe_status} content_type=${probe_content_type}"
              if is_transient_failure "${probe_status}" "${probe_curl_exit}"; then
                transient_seen="true"
                probe_retryable="true"
              fi
            done <<< "${candidates}"

            if [[ -n "${selected_url}" ]]; then
              break
            fi
            if [[ "${probe_retryable}" == "true" && "${attempt}" != "${max_attempts}" ]]; then
              sleep "${attempt}"
              continue
            fi
            break
          done

          if [[ -z "${selected_url}" ]]; then
            echo "No signed /media/render URL candidate returned 200 with image/* content type."
            exit 1
          fi

          assert_single_line_value "MEDIA_RENDER_URL" "${selected_url}"
          printf 'MEDIA_RENDER_URL=%s\n' "${selected_url}" >> "${GITHUB_ENV}"
          printf 'AUTH_BEARER_TOKEN=%s\n' "${token}" >> "${GITHUB_ENV}"
          write_optional_cache_split_urls
          echo "MEDIA_RENDER_URL source: ${selected_source}"

      - name: Validate performance inputs
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        run: |
          if [[ -z "${MEDIA_RENDER_URL}" ]]; then
            echo "MEDIA_RENDER_URL resolution failed."
            exit 1
          fi
          if [[ "${ENABLE_ANALYZE}" == "1" && -z "${ANALYZE_PATH}" ]]; then
            echo "analyze_path input is required when enable_analyze=1."
            exit 1
          fi
          if [[ "${ENABLE_ANALYZE}" == "1" && ! -f "${ANALYZE_PATH}" ]]; then
            echo "analyze_path does not exist."
            exit 1
          fi

      - name: Download baseline summary artifact
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${BASELINE_SUMMARY_PATH}" ]]; then
            echo "Using checked-out baseline summary path: ${BASELINE_SUMMARY_PATH}"
            exit 0
          fi
          mkdir -p artifacts/perf/baseline
          gh run download "${BASELINE_SUMMARY_ARTIFACT_RUN_ID}" \
            --name "${BASELINE_SUMMARY_ARTIFACT_NAME}" \
            --dir artifacts/perf/baseline

      - name: Run media performance smoke gate
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        env:
          K6_VUS: "5"
          K6_DURATION: "60s"
          OUT_DIR: artifacts/perf/backend-media-smoke-${{ github.run_id }}
        run: |
          bash scripts/perf/run-media-baseline.sh

      - name: Compare with baseline summary
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        env:
          AFTER_SUMMARY_PATH: artifacts/perf/backend-media-smoke-${{ github.run_id }}/summary.json
        run: |
          set -euo pipefail

          baseline_summary="${BASELINE_SUMMARY_PATH}"
          if [[ -z "${baseline_summary}" ]]; then
            baseline_download_dir="artifacts/perf/baseline"
            mapfile -t baseline_matches < <(
              find "${baseline_download_dir}" -type f -name summary.json | while IFS= read -r candidate_path; do
                relative_path="${candidate_path#${baseline_download_dir}/}"
                if [[ "${relative_path}" != baseline/* ]]; then
                  printf '%s\n' "${candidate_path}"
                fi
              done | sort
            )
            if [[ "${#baseline_matches[@]}" == "1" ]]; then
              baseline_summary="${baseline_matches[0]}"
            elif [[ "${#baseline_matches[@]}" == "0" ]]; then
              echo "Baseline summary.json was not found."
              exit 1
            else
              echo "Baseline artifact contains multiple summary.json files; set baseline_summary_path to the exact file."
              printf '%s\n' "${baseline_matches[@]}"
              exit 1
            fi
          fi
          if [[ -z "${baseline_summary}" || ! -f "${baseline_summary}" ]]; then
            echo "Baseline summary.json was not found."
            exit 1
          fi
          if [[ ! -f "${AFTER_SUMMARY_PATH}" ]]; then
            echo "New summary.json was not found."
            exit 1
          fi
          tolerance_args=()
          compare_help="$(python3 scripts/perf/compare-media-summaries.py --help)"
          if grep -q -- "--max-regression-percent" <<< "${compare_help}"; then
            tolerance_args=(--max-regression-percent 15)
          elif grep -q -- "--tolerance" <<< "${compare_help}"; then
            tolerance_args=(--tolerance 0.15)
          fi
          if grep -q -- "--min-latency-regression-ms" <<< "${compare_help}"; then
            tolerance_args+=(--min-latency-regression-ms 100)
          fi
          required_metric_args=(
            --require-metric render_failure_rate.rate
            --require-metric "render_latency.p(95)"
          )
          cache_header_args=()
          if [[ "${REQUIRE_MEDIA_RENDER_CACHE_HEADER:-0}" == "1" ]]; then
            cache_header_args=(--require-cache-header)
            required_metric_args+=(
              --require-metric render_cache_hit_failure_rate.rate
              --require-metric "render_cache_hit_latency.p(95)"
              --require-metric render_cache_disabled_rate.rate
              --require-metric render_cache_unknown_rate.rate
            )
            if [[ -n "${MEDIA_RENDER_CACHE_MISS_URLS:-}" || -n "${MEDIA_RENDER_CACHE_MISS_URLS_PATH:-}" ]]; then
              required_metric_args+=(
                --require-metric render_cache_miss_failure_rate.rate
                --require-metric "render_cache_miss_latency.p(95)"
              )
            fi
          fi
          python3 scripts/perf/compare-media-summaries.py \
            --before "${baseline_summary}" \
            --after "${AFTER_SUMMARY_PATH}" \
            --fail-on-regression \
            --enforce-thresholds \
            --min-render-cache-miss-samples "${MIN_RENDER_CACHE_MISS_SAMPLES:-15}" \
            "${cache_header_args[@]}" \
            "${tolerance_args[@]}" \
            "${required_metric_args[@]}"

      - name: Run media performance stress diagnostic
        if: ${{ steps.resolve-inputs.outputs.validate_only != '1' }}
        continue-on-error: true
        env:
          K6_VUS: "20"
          K6_DURATION: "60s"
          OUT_DIR: artifacts/perf/backend-media-stress-${{ github.run_id }}
        run: |
          bash scripts/perf/run-media-baseline.sh

      - name: Scan performance artifacts for secret leaks
        id: artifact_secret_scan
        if: always()
        run: python3 .github/scripts/scan_artifact_secrets.py artifacts/perf

      - name: Upload performance artifacts
        if: ${{ always() && steps.artifact_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-media-performance-regression-${{ github.run_id }}
          path: artifacts/perf
          if-no-files-found: error
          retention-days: 14
