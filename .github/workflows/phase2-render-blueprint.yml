name: Phase2 Render Blueprint Gate

on:
  pull_request:
    paths:
      - render.yaml
      - backend/scripts/ci_render_blueprint_gate.sh
      - .github/scripts/validate_render_live_env.py
      - backend/tests/runtime/test_phase4_operational_config.py
      - .github/workflows/phase2-render-blueprint.yml
  push:
    branches:
      - main
    paths:
      - render.yaml
      - backend/scripts/ci_render_blueprint_gate.sh
      - .github/scripts/validate_render_live_env.py
      - backend/tests/runtime/test_phase4_operational_config.py
      - .github/workflows/phase2-render-blueprint.yml
  workflow_dispatch:

jobs:
  render-blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Render blueprint and env parity
        run: bash backend/scripts/ci_render_blueprint_gate.sh

      - name: Validate Render live env checker contract
        run: python -m unittest backend.tests.runtime.test_phase4_operational_config

      - name: Validate Render live env parity
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_SERVICE_ID_FOODLENS_API: ${{ secrets.RENDER_SERVICE_ID_FOODLENS_API }}
          RENDER_SERVICE_ID_FOODLENS_WORKER: ${{ secrets.RENDER_SERVICE_ID_FOODLENS_WORKER }}
          RENDER_SERVICE_ID_FOODLENS_RETENTION_CRON: ${{ secrets.RENDER_SERVICE_ID_FOODLENS_RETENTION_CRON }}
        run: python .github/scripts/validate_render_live_env.py --blueprint render.yaml
