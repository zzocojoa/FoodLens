<!doctype html>
<html lang="{{ page.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | FoodLens</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/legal.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header" aria-label="FoodLens">
      <a class="wordmark" href="{{ '/' | relative_url }}">FoodLens</a>
      <nav class="top-nav" aria-label="법적 문서">
        <a href="{{ '/docs/privacy-policy/' | relative_url }}">Privacy</a>
        <a href="{{ '/docs/terms-of-service/' | relative_url }}">Terms</a>
      </nav>
    </header>

    <div class="legal-shell">
      <aside class="legal-sidebar">
        <nav class="legal-nav" aria-label="{{ page.title | escape }} 목차">
          <span class="eyebrow">{{ page.nav_eyebrow | default: 'Legal' }}</span>
          <strong>{{ page.title }}</strong>
          {% for item in page.nav %}
          <a href="{{ item.href }}">{{ item.label }}</a>
          {% endfor %}
        </nav>
      </aside>

      <main id="main" class="legal-main" tabindex="-1">
        <section class="doc-title" aria-labelledby="doc-title">
          {% if page.effective_date %}
          <p class="updated">{{ page.effective_date }}</p>
          {% endif %}
          <h1 id="doc-title">{{ page.title }}</h1>
          {% if page.lead %}
          <p class="intro">{{ page.lead }}</p>
          {% endif %}
        </section>

        <article class="legal-content">
          {{ content }}
        </article>
      </main>
    </div>
  </body>
</html>
